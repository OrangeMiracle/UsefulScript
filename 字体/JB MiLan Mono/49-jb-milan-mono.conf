<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <description>Prefer JB MiLan Mono for generic font families</description>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>JB MiLan Mono</family></prefer>
  </alias>
  <alias binding="strong">
    <family>serif</family>
    <prefer><family>JB MiLan Mono</family></prefer>
  </alias>
  <alias binding="strong">
    <family>monospace</family>
    <prefer><family>JB MiLan Mono</family></prefer>
  </alias>
  <alias binding="strong">
    <family>system-ui</family>
    <prefer><family>JB MiLan Mono</family></prefer>
  </alias>
</fontconfig>
